<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماجرای روباه سکه‌جمع‌کن</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9dc;--fg:#2a2320;--panel:#fffaf0;--line:#d8cdb6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1822;--fg:#f2ecdf;--panel:#26232f;--line:#3b3748}}
:root[data-theme="dark"]{--bg:#1a1822;--fg:#f2ecdf;--panel:#26232f;--line:#3b3748}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Vazirmatn",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:18px;margin-bottom:10px}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);line-height:0}
canvas{width:100%;height:auto;display:block;background:#8fd3f4;touch-action:none}
#toast{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:rgba(30,25,20,.88);color:#fff;padding:10px 18px;border-radius:10px;font-weight:800;font-size:17px;line-height:1.6;text-align:center;max-width:90%;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#ovl{position:absolute;inset:0;background:rgba(20,16,30,.78);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;line-height:1.5}
#ovl[hidden]{display:none}
#ovl h2{margin:0;font-size:38px;font-weight:800}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 22px;background:#f0a030;color:#2a1a05;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pad{display:none;justify-content:space-between;gap:10px;margin-top:10px;direction:ltr}
.pad button{flex:1;font-size:26px;padding:16px 0;user-select:none;touch-action:none}
@media (pointer:coarse){.pad{display:flex}}
.hint{margin:10px 2px 0;font-size:14px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span id="lv">❤️ ۳</span><span id="cn">🪙 ۰ / ۱۰۰</span><span id="bs"></span></div>
  <div class="stage">
    <canvas id="c" width="800" height="400"></canvas>
    <div id="toast"></div>
    <div id="ovl" hidden><h2 id="ot"></h2><button id="ob">شروع دوباره</button></div>
  </div>
  <div class="pad"><button data-k="l">◀</button><button data-k="j">⬆</button><button data-k="r">▶</button></div>
  <p class="hint">حرکت: فلش‌ها یا A و D — پرش: فاصله یا فلش بالا — برای کشتن دشمن روی سرش بپر.</p>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=800,H=400,GY=340,END=5200;
const $=id=>document.getElementById(id);
const fa=n=>n.toLocaleString('fa-IR');
const keys={},tc={};
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Enter'&&!$('ovl').hidden)init();});
addEventListener('keyup',e=>keys[e.code]=0);
document.querySelectorAll('.pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();tc[k]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>tc[k]=0));
});
$('ob').onclick=()=>init();

// ----- level -----
const pits=[[700,780],[1250,1350],[1900,1990],[2500,2600],[3100,3180]];
const plats=[[500,260,120],[900,250,140],[1100,200,100],[1450,260,120],[1600,210,120],[2100,250,140],[2300,200,120],[2700,260,160],[2950,210,120],[3300,250,140]];
const EN=[420,1000,1130,1550,1750,2200,2420,2800,3000,3400];
const solids=[];
(function(){let x=0;for(const [a,b] of pits){solids.push({x,y:GY,w:a-x,h:60,g:1});x=b}solids.push({x,y:GY,w:END-x+40,h:60,g:1});
 for(const [px,py,pw] of plats)solids.push({x:px,y:py,w:pw,h:16});})();
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(o){
  o.x+=o.vx;
  for(const s of solids)if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.vx=0}
  o.y+=o.vy;o.on=false;
  for(const s of solids)if(hit(o,s)){if(o.vy>0){o.y=s.y-o.h;o.on=true}else o.y=s.y+s.h;o.vy=0}
}

// ----- state -----
let p,coins,lives,enemies,coinsL,boss,over,won,cp,cam,spawnT,t=0,toastT=0,shake=0;
function init(){
  p={x:60,y:290,w:24,h:32,vx:0,vy:0,on:false,face:1,inv:0};
  coins=0;lives=3;cp=60;cam=0;boss=null;spawnT=-1;over=won=false;shake=0;
  coinsL=[];for(let i=0;i<120;i++)coinsL.push({x:300+i*28,y:275-30*Math.sin(i/4),got:0});
  enemies=EN.map(x=>({x,y:GY-24,w:28,h:24,vx:.9,home:x,dead:0}));
  $('ovl').hidden=true;hud();
}
function hud(){
  $('lv').textContent='❤️ '+fa(lives);
  $('cn').textContent='🪙 '+fa(coins)+' / ۱۰۰'+(coins>=100?' (کامل)':'');
  $('bs').textContent=boss&&boss.hp>0?'👹 غول: '+fa(boss.hp):'';
}
function toast(s,ms=2600){const e=$('toast');e.textContent=s;e.classList.add('on');toastT=ms;clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms)}
function end(title){$('ot').textContent=title;$('ovl').hidden=false;$('ob').focus()}
function getCoin(){
  if(coins>=100)return;            // بعد از ۱۰۰ شمارش متوقف می‌شود
  coins++;
  if(coins===100){lives++;spawnT=150;toast('۱۰۰ سکه! یه جون اضافه گرفتی ❤️ — شمارنده متوقف شد. مراقب باش، یه غول داره میاد!',3600)}
  hud();
}
function die(){
  lives--;hud();
  if(lives<=0){over=true;end('باختی 😵');return}
  p.x=cp;p.y=250;p.vx=p.vy=0;p.inv=120;
}
function hurt(){
  if(p.inv>0)return;
  lives--;hud();
  if(lives<=0){over=true;end('باختی 😵');return}
  p.inv=110;p.vy=-7;
}
function spawnBoss(){
  boss={x:Math.max(4100,p.x+420),y:-150,w:90,h:110,vx:0,vy:0,on:false,hp:5,flash:0,dir:-1,jt:0};
  shake=40;toast('غول سنگی اومد! ۵ بار روی سرش بپر 👹',3200);hud();
}

// ----- update -----
function update(){
  if(over||won)return;
  t++;
  const L=keys.ArrowLeft||keys.KeyA||tc.l,R=keys.ArrowRight||keys.KeyD||tc.r,J=keys.ArrowUp||keys.KeyW||keys.Space||tc.j;
  p.vx=(R?1:0)*3.4-(L?1:0)*3.4;
  if(p.vx)p.face=Math.sign(p.vx);
  if(J&&p.on)p.vy=-11.8;
  if(!J&&p.vy<-4)p.vy=-4;
  p.vy=Math.min(p.vy+.55,14);
  move(p);
  p.x=Math.max(0,Math.min(END-p.w,p.x));
  if(coins<100&&p.x>3850){p.x=3850;if(!update.w){update.w=1;toast('راه بسته‌ست! اول ۱۰۰ تا سکه جمع کن 🪙',2500);setTimeout(()=>update.w=0,4000)}}
  if(p.inv>0)p.inv--;
  if(p.y>H+60)die();
  if(p.on&&p.x>2050)cp=Math.max(cp,2050);
  if(p.on&&p.x>3650)cp=Math.max(cp,3650);
  for(const c of coinsL)if(!c.got&&Math.abs(c.x-(p.x+12))<24&&Math.abs(c.y-(p.y+16))<34){c.got=1;getCoin()}
  for(const e of enemies){
    if(e.dead)continue;
    e.x+=e.vx;if(Math.abs(e.x-e.home)>70)e.vx=-e.vx;
    if(hit(p,e)){
      if(p.vy>0&&p.y+p.h<e.y+16){e.dead=1;p.vy=-8}else hurt();
    }
  }
  if(spawnT>0&&--spawnT===0)spawnBoss();
  if(boss&&boss.hp>0){
    const b=boss;
    if(b.flash>0)b.flash--;
    b.dir=p.x+12<b.x+45?-1:1;
    const sp=1+(5-b.hp)*.3;
    b.vx=b.y<0?0:b.dir*sp;
    if(b.on&&++b.jt>140){b.vy=-10;b.jt=0}
    b.vy=Math.min(b.vy+.55,14);
    move(b);
    b.x=Math.max(4000,Math.min(END-b.w,b.x));
    if(b.on&&b.vy===0&&b.y>0&&shake===0&&b.jt===1)shake=0;
    if(hit(p,b)){
      if(p.vy>0&&p.y+p.h<b.y+36&&b.flash===0){
        b.hp--;b.flash=50;p.vy=-12;shake=12;hud();
        if(b.hp<=0){won=true;toast('غول شکست خورد!',2000);end('بردی! 🏆');}
      }else if(b.flash===0)hurt();
    }
  }
  if(shake>0)shake--;
  cam=Math.max(0,Math.min(END-W,p.x-W*.35));
}

// ----- draw -----
function draw(){
  const sg=g.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#6cc4ee');sg.addColorStop(1,'#d8f1fb');
  g.fillStyle=sg;g.fillRect(0,0,W,H);
  // far hills
  g.fillStyle='#9fd9a8';
  for(let i=-1;i<8;i++){const x=i*260-(cam*.3)%260;g.beginPath();g.ellipse(x+130,GY,150,90,0,Math.PI,0);g.fill()}
  // clouds
  g.fillStyle='rgba(255,255,255,.9)';
  for(let i=-1;i<6;i++){const x=i*220-(cam*.5)%220+(i%2)*40,y=50+(i%3)*30;
    g.beginPath();g.ellipse(x,y,38,14,0,0,7);g.ellipse(x+24,y-8,24,14,0,0,7);g.fill()}
  g.save();
  const sx=shake?(Math.random()-.5)*8:0;
  g.translate(-Math.round(cam)+sx,0);
  // ground & platforms
  for(const s of solids){
    if(s.x+s.w<cam-10||s.x>cam+W+10)continue;
    if(s.g){g.fillStyle='#8a5a34';g.fillRect(s.x,s.y,s.w,s.h);g.fillStyle='#4fb04a';g.fillRect(s.x,s.y,s.w,10);
      g.fillStyle='#3e9440';g.fillRect(s.x,s.y+10,s.w,4)}
    else{g.fillStyle='#c0703a';g.fillRect(s.x,s.y,s.w,s.h);g.fillStyle='#e0955a';g.fillRect(s.x,s.y,s.w,4);
      g.fillStyle='#8a4a22';for(let x=s.x+20;x<s.x+s.w;x+=20)g.fillRect(x,s.y+4,2,s.h-4)}
  }
  // coins
  for(const c of coinsL){
    if(c.got||c.x<cam-20||c.x>cam+W+20)continue;
    const w=Math.abs(Math.cos(t/14+c.x/40))*8+1.5;
    g.fillStyle='#f5b800';g.beginPath();g.ellipse(c.x,c.y,w,9,0,0,7);g.fill();
    g.fillStyle='#ffe27a';g.beginPath();g.ellipse(c.x,c.y,Math.max(w-3,.5),5.5,0,0,7);g.fill();
  }
  // enemies (spiky slimes)
  for(const e of enemies){
    if(e.dead||e.x<cam-40||e.x>cam+W+40)continue;
    g.fillStyle='#7a4fb0';g.beginPath();g.ellipse(e.x+14,e.y+24,15,20,0,Math.PI,0);g.fill();
    g.fillStyle='#5a3490';for(let i=0;i<3;i++){g.beginPath();g.moveTo(e.x+3+i*9,e.y+6);g.lineTo(e.x+7+i*9,e.y-4);g.lineTo(e.x+11+i*9,e.y+6);g.fill()}
    g.fillStyle='#fff';g.fillRect(e.x+7,e.y+10,5,6);g.fillRect(e.x+17,e.y+10,5,6);
    g.fillStyle='#000';g.fillRect(e.x+9+(e.vx>0?1:0),e.y+12,2,3);g.fillRect(e.x+19+(e.vx>0?1:0),e.y+12,2,3);
  }
  if(coins<100){g.fillStyle='#fff';g.fillRect(3876,230,10,110);g.fillStyle='#d9432b';for(let y=230;y<340;y+=20)g.fillRect(3876,y,10,10)}
  if(boss&&boss.hp>0)drawBoss(boss);
  drawFox();
  g.restore();
  if(boss&&boss.hp>0&&boss.y>-100){
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(W/2-100,12,200,12);
    g.fillStyle='#e8503a';g.fillRect(W/2-100,12,40*boss.hp,12);
  }
}
function drawFox(){
  if(p.inv>0&&Math.floor(p.inv/5)%2)return;
  const x=p.x,y=p.y,f=p.face,cx=x+12;
  g.save();g.translate(cx,0);g.scale(f,1);g.translate(-cx,0);
  const step=p.on&&p.vx?Math.sin(t/3)*3:0;
  g.fillStyle='#e8803a';g.beginPath();g.moveTo(x,y+22);g.lineTo(x-12,y+12+Math.sin(t/8)*2);g.lineTo(x-4,y+30);g.fill(); // tail
  g.fillStyle='#e8803a';g.fillRect(x+2,y+10,20,16);                // body
  g.fillStyle='#fff3e0';g.fillRect(x+8,y+16,12,10);
  g.fillStyle='#5a3220';g.fillRect(x+3,y+26,7,6+step*.3);g.fillRect(x+14,y+26,7,6-step*.3); // feet
  g.fillStyle='#e8803a';g.fillRect(x+1,y-2,22,14);                 // head
  g.beginPath();g.moveTo(x+2,y);g.lineTo(x+4,y-10);g.lineTo(x+9,y);g.fill();
  g.beginPath();g.moveTo(x+15,y);g.lineTo(x+20,y-10);g.lineTo(x+23,y);g.fill();
  g.fillStyle='#1f6fb5';g.fillRect(x+1,y+10,22,4);                 // scarf
  g.fillStyle='#fff';g.fillRect(x+13,y+3,6,6);g.fillStyle='#000';g.fillRect(x+16,y+5,3,3);
  g.fillStyle='#5a3220';g.fillRect(x+21,y+8,3,3);
  g.restore();
}
function drawBoss(b){
  const f=b.flash>0&&Math.floor(b.flash/4)%2;
  g.fillStyle=f?'#fff':'#7d7468';g.fillRect(b.x+10,b.y+30,70,80);
  g.fillStyle=f?'#fff':'#948a7c';g.fillRect(b.x+16,b.y,58,42);
  g.fillStyle=f?'#fff':'#6a6258';g.fillRect(b.x-6,b.y+32,22,50);g.fillRect(b.x+74,b.y+32,22,50);
  g.fillStyle='#4a443c';g.fillRect(b.x+14,b.y+92,26,18);g.fillRect(b.x+50,b.y+92,26,18);
  g.fillStyle='#ff4a2a';const ox=b.dir*4;g.fillRect(b.x+27+ox,b.y+14,10,8);g.fillRect(b.x+53+ox,b.y+14,10,8);
  g.fillStyle='#2a2622';g.fillRect(b.x+32,b.y+30,26,5);
  g.fillStyle='#5a5348';g.fillRect(b.x+30,b.y+50,3,24);g.fillRect(b.x+56,b.y+60,3,22);
}

// ----- loop (fixed 60 fps step) -----
let last=performance.now(),acc=0;
function frame(n){
  acc+=Math.min(n-last,100);last=n;
  while(acc>=1000/60){update();acc-=1000/60}
  draw();requestAnimationFrame(frame);
}
init();requestAnimationFrame(frame);
</script>
</body>
</html>
